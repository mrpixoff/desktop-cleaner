[package]
name = "desktop_cleaner"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
notify = "6"
unicode-normalization = "0.1"
trash = "5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.19"
winit = "0.30"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
